/* ================= AUTH (PBKDF2 + salt, không lưu mật khẩu thô) ================= */
const Auth = {
  users:()=>Store.get('users',{}), me:()=>Store.get('session',null),
  async hash(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
    const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},k,256);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')},
  async register(u,pw){const us=this.users();if(us[u])throw Error('Tên đã tồn tại');
    const salt=crypto.getRandomValues(new Uint8Array(16));us[u]={salt:[...salt],h:await this.hash(pw,salt)};Store.set('users',us);Store.set('session',u)},
  async login(u,pw){const r=this.users()[u];if(!r)throw Error('Sai tài khoản hoặc mật khẩu');
    if(await this.hash(pw,new Uint8Array(r.salt))!==r.h)throw Error('Sai tài khoản hoặc mật khẩu');Store.set('session',u)},
  logout(){Store.set('session',null)}
};

/* ================= VIETQR (EMVCo/NAPAS) ================= */
const VietQR = {
  tlv:(id,v)=>id+String(v.length).padStart(2,'0')+v,
  crc(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')},
  build({bin,acc,amount,note}){ // amount rỗng => QR tĩnh
    const t=this.tlv, mi=t('00','A000000727')+t('01',t('00',bin)+t('01',acc))+t('02','QRIBFTTA');
    let p=t('00','01')+t('01',amount?'12':'11')+t('38',mi)+t('53','704')+(amount?t('54',String(amount)):'')+t('58','VN')+(note?t('62',t('08',note)):'')+'6304';
    return p+this.crc(p)}
};
const drawQR=(el,text,size=140)=>{el.innerHTML='';new QRCode(el,{text,width:size,height:size,correctLevel:QRCode.CorrectLevel.M})};

    const drawFiles=()=>{
      $('#fileCategories').hidden=true;$('#fileBrowser').hidden=false;
      const category=FILE_CATEGORIES.find(c=>c.id===g);
      $('#fileHeading').textContent=category.label;
      const r=FILES.filter(f=>fileCategory(f.game)===g&&
        `${f.name} ${f.game} ${f.tags.join(' ')}`.toLowerCase().includes(q));
      const gameTag=g==='Free Fire'?'tag-freefire':g==='Liên Quân Mobile'?'tag-lienquan':g==='Roblox'?'tag-roblox':'tag-other';
      $('#list').innerHTML=r.length?r.map(f=>`<article class="glass file-card"><div class="file-card-head"><span class="game-tag ${gameTag}">${esc(f.game.toUpperCase())}</span><span class="meta-tag">FILE</span></div><h3>${esc(f.name)}</h3><div class="file-tags"><span class="meta-tag">Version ${esc(f.ver)}</span><span class="meta-tag">${esc(f.size)}</span><span class="meta-tag">Antiban: ${esc(f.anti)}</span>${f.tags.map(tag=>`<span class="meta-tag">${esc(tag)}</span>`).join('')}</div><a class="btn" href="#${esc(f.path)}">Mở file · ${esc(f.path)}</a></article>`).join(''):EMPTY('Chưa có file trong mục này');
    };
    const openFileDetails=f=>{
        const hasLink=/^(https?:|data:)/i.test(f.url);
        const gameTag=fileCategory(f.game)==='Free Fire'?'tag-freefire':fileCategory(f.game)==='Liên Quân Mobile'?'tag-lienquan':fileCategory(f.game)==='Roblox'?'tag-roblox':'tag-other';
        Modal.open(`<div class="detail-head"><h2>${esc(f.name)}</h2></div><span class="game-tag ${gameTag}">${esc(f.game.toUpperCase())}</span><div class="file-modal-info"><div><strong>Version</strong>${esc(f.ver)}</div><div><strong>Loại file</strong>${esc(f.tags[0]||'File')}</div><div><strong>Antiban</strong>${esc(f.anti)}</div><div><strong>Dung lượng</strong>${esc(f.size)}</div></div><p>${esc(f.desc)}</p><div class="file-tags">${f.tags.map(tag=>`<span class="meta-tag">${esc(tag)}</span>`).join('')}</div><div class="row">${hasLink?`<a class="btn pk" href="${esc(f.url)}" target="_blank" rel="noopener noreferrer">⬇ Tải file</a>`:'<button class="pk" id="dl" type="button">⬇ Link tải chưa được thêm</button>'}</div>`);
        const download=$('#dl');if(download)download.onclick=()=>Toast('Hãy thêm liên kết tải vào url của file trong danh sách FILES',true)
    };
    $('#fileBack').onclick=()=>{
      g=null;q='';
      if(location.hash!=='#/files')location.hash='#/files';
      drawCategories()
    };
    $('#q').oninput=e=>{q=e.target.value.toLowerCase();drawFiles()};
    if(g&&FILE_CATEGORIES.some(category=>category.id===g)){
      drawFiles();
      const file=FILES.find(item=>item.path==='/'+routeParts.join('/'));
      if(file)openFileDetails(file)
    }else drawCategories()
  }},

  legal:{t:'Điều khoản & chính sách',html:()=>`<div class="legal-page">
    <h1>Điều khoản &amp; chính sách</h1>
    <p class="legal-intro">Thông tin áp dụng cho website MT MEDIA GLOBAL. Vui lòng đọc các mục phù hợp trước khi sử dụng dịch vụ.</p>
    <nav class="legal-nav" aria-label="Các chính sách">${[['terms','Điều khoản sử dụng'],['privacy','Chính sách bảo mật'],['dmca','DMCA']].map(([slug,label])=>`<a href="#/legal/${slug}" data-legal-link="${slug}">${label}</a>`).join('')}</nav>
    <p class="legal-updated">Cập nhật lần cuối: 26/10/2026</p>
    <section id="legal-terms" class="glass legal-section">
      <h2>Điều khoản sử dụng</h2>
      <h3>1. Phạm vi dịch vụ</h3>
      <p>Website cung cấp công cụ tạo hóa đơn hiển thị, tạo mã QR, quản lý thông tin trong trình duyệt và giới thiệu sản phẩm/liên kết. Các tính năng này chỉ hỗ trợ thao tác, không xác nhận giao dịch đã được ngân hàng, nhà mạng hoặc nhà phát hành game xử lý.</p>
      <h3>2. Bill, mã QR và thanh toán</h3>
      <p>Bill do website tạo là thông tin tham khảo, không phải biên lai chính thức hoặc bằng chứng thanh toán. Hãy kiểm tra trạng thái trong ứng dụng/ngân hàng hoặc hệ thống của nhà cung cấp. Người dùng chịu trách nhiệm kiểm tra số tiền, tài khoản, nội dung chuyển khoản và thông tin trước khi xác nhận giao dịch.</p>
      <h3>3. Sử dụng hợp pháp</h3>
      <p>Bạn đồng ý không dùng website để lừa đảo, giả mạo chứng từ, xâm phạm quyền của người khác, phát tán nội dung trái pháp luật hoặc can thiệp gây ảnh hưởng đến hệ thống và người dùng khác. Chỉ tải, chia sẻ hoặc sử dụng tệp khi bạn có quyền và tuân thủ điều khoản của chủ sở hữu/nền tảng liên quan.</p>
      <h3>4. Sản phẩm và liên kết bên ngoài</h3>
      <p>Thông tin về giá, sản phẩm, tệp và liên kết có thể thay đổi. Website không kiểm soát các trang của bên thứ ba; trước khi mua, tải tệp hoặc cung cấp dữ liệu cho dịch vụ bên ngoài, hãy tự kiểm tra nguồn, điều kiện giao dịch và độ an toàn.</p>
      <h3>5. Giới hạn và cập nhật</h3>
      <p>Dịch vụ được cung cấp theo hiện trạng và có thể tạm ngưng để bảo trì hoặc cập nhật. Điều khoản có thể được sửa đổi khi website thay đổi; phiên bản đăng tại đây là phiên bản hiện hành.</p>
    </section>
    <section id="legal-privacy" class="glass legal-section">
      <h2>Chính sách bảo mật</h2>
      <h3>1. Dữ liệu được lưu</h3>
      <p>Website chạy phía trình duyệt và có thể lưu một số dữ liệu trên thiết bị bằng localStorage, gồm tùy chọn giao diện/chế độ, giỏ hàng, lịch sử bill và tài khoản đăng ký cục bộ. Mật khẩu đăng ký được băm trước khi lưu; không nên dùng lại mật khẩu quan trọng. Dữ liệu cục bộ có thể mất khi bạn xóa dữ liệu trình duyệt hoặc đổi thiết bị.</p>
      <h3>2. Thông tin nhập vào biểu mẫu</h3>
      <p>Thông tin bạn nhập để tạo bill được xử lý để hiển thị bill và QR trong trình duyệt. Lịch sử bill có thể được lưu cục bộ trên thiết bị. Hãy tránh nhập thông tin nhạy cảm không cần thiết và không dùng ảnh bill làm bằng chứng giao dịch thực tế.</p>
      <h3>3. Dịch vụ của bên thứ ba</h3>
      <p>Website có thể tải thư viện, phông chữ, hình ảnh hoặc nội dung từ nhà cung cấp bên ngoài; khi truy cập các tài nguyên này, trình duyệt có thể gửi yêu cầu tới nhà cung cấp tương ứng. Các liên kết thanh toán, liên hệ và tải tệp cũng dẫn tới dịch vụ bên thứ ba có chính sách riêng.</p>
      <h3>4. Lựa chọn và bảo vệ dữ liệu</h3>
      <p>Bạn có thể xóa dữ liệu website trong phần cài đặt dữ liệu trang của trình duyệt. Không chia sẻ thiết bị hoặc tài khoản cục bộ nếu không muốn người khác xem dữ liệu đã lưu. Website không thể bảo đảm an toàn cho thiết bị, trình duyệt hoặc dịch vụ bên thứ ba.</p>
      <h3>5. Liên hệ</h3>
      <p>Nếu có câu hỏi về quyền riêng tư hoặc muốn yêu cầu hỗ trợ liên quan đến dữ liệu, hãy liên hệ MT MEDIA GLOBAL qua <a href="${DEV_CONTACT}" target="_blank" rel="noopener noreferrer">kênh Zalo hỗ trợ</a>.</p>
    </section>
    <section id="legal-dmca" class="glass legal-section">
      <h2>DMCA &amp; yêu cầu gỡ bỏ nội dung</h2>
      <p>MT MEDIA GLOBAL tôn trọng quyền tác giả và quyền sở hữu trí tuệ. Nếu bạn là chủ sở hữu quyền hoặc đại diện được ủy quyền và cho rằng nội dung/liên kết trên website xâm phạm quyền của mình, hãy gửi yêu cầu để chúng tôi xem xét.</p>
      <h3>Thông tin cần có trong thông báo</h3>
      <ul>
        <li>Thông tin nhận diện và cách liên hệ với người gửi; nếu đại diện, nêu rõ tư cách đại diện.</li>
        <li>Mô tả tác phẩm hoặc quyền sở hữu trí tuệ bị cho là xâm phạm.</li>
        <li>URL cụ thể của nội dung/liên kết cần xem xét và vị trí trên website.</li>
        <li>Tuyên bố rằng bạn tin tưởng một cách thiện chí việc sử dụng bị khiếu nại không được chủ sở hữu, đại diện hoặc pháp luật cho phép.</li>
        <li>Tuyên bố thông tin trong yêu cầu là chính xác và bạn là chủ sở hữu quyền hoặc được ủy quyền hành động; kèm chữ ký điện tử hoặc chữ ký phù hợp.</li>
      </ul>
      <p>Gửi thông báo qua <a href="${DEV_CONTACT}" target="_blank" rel="noopener noreferrer">kênh liên hệ Zalo</a> và ghi tiêu đề “Yêu cầu bản quyền/DMCA”. Vui lòng chỉ cung cấp thông tin cần thiết. Chúng tôi sẽ xem xét yêu cầu và có thể đề nghị bổ sung thông tin hoặc hạn chế quyền truy cập nội dung khi phù hợp. Việc gửi thông báo không tự động đồng nghĩa nội dung bị gỡ ngay; đây là quy trình tiếp nhận nội bộ, không thay thế tư vấn pháp lý.</p>
    </section>
  </div>`,init(){
    const route=location.hash.split('/')[2],section={terms:'legal-terms',privacy:'legal-privacy',dmca:'legal-dmca'}[route]||'legal-terms';
    $$('[data-legal-link]').forEach(link=>{if(link.dataset.legalLink===route)link.setAttribute('aria-current','page')});
    requestAnimationFrame(()=>document.getElementById(section)?.scrollIntoView({block:'start'}))
  }},
  login:{t:'Đăng nhập',html:()=>`<h2>Đăng nhập / Đăng ký</h2><form class="glass card" id="af" style="max-width:380px"><label for="u">Tên tài khoản</label><input id="u" required minlength="3" autocomplete="username"><label for="p">Mật khẩu (≥ 6 ký tự)</label><input id="p" type="password" required minlength="6" autocomplete="current-password"><div class="err" id="ae"></div><div class="row"><button class="pk" data-m="login">Đăng nhập</button><button type="button" data-m="register">Đăng ký</button></div></form>`,init(){
    let mode='login';const f=$('#af');$$('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;if(b.type==='button')f.requestSubmit()});
    f.onsubmit=async e=>{e.preventDefault();const u=$('#u').value.trim(),p=$('#p').value;
      if(u.length<3||p.length<6)return $('#ae').textContent='Tên ≥ 3 ký tự, mật khẩu ≥ 6 ký tự';
      try{await Auth[mode](u,p);Toast('Xin chào '+u);location.hash='#/profile'}catch(x){$('#ae').textContent=x.message}}}}
};
Views.profile.html=Views.profile.html.bind(Views.profile);

/* ================= ROUTER (hash + skeleton + title động) ================= */
const NAV=[['home','Home'],['bill','Tạo Bill'],['shop','Shop'],['files','Files'],['profile','Profile']];
const Router = {
  timer:0,
  render(instant){
    const key=(location.hash.replace('#/','')||'home').split('/')[0].split('?')[0], v=Views[key]||Views.home, k=Views[key]?key:'home';
    closeMobileMenu();
    document.title=v.t+' · MT MEDIA GLOBAL';
    $('#nav').innerHTML=NAV.map(n=>`<a href="#/${n[0]}" ${n[0]===k?'aria-current="page"':''}>${n[1]}</a>`).join('')+`<a href="#/login" ${k==='login'?'aria-current="page"':''}>${Auth.me()?'Tài khoản':'Đăng nhập'}</a>`;
    const app=$('#app');clearTimeout(this.timer);
    const go=()=>{app.innerHTML=v.html();v.init&&v.init();app.focus({preventScroll:true})};
    if(instant)return go();
    app.innerHTML='<div class="sk"></div><div class="sk"></div>';this.timer=setTimeout(go,220);window.scrollTo(0,0)
  }
};

/* ================= KHỞI ĐỘNG ================= */
const closeMobileMenu=()=>{const button=$('#mobileMenuToggle');button.setAttribute('aria-expanded','false');button.setAttribute('aria-label','Mở menu');button.title='Mở menu'};
$('#mobileMenuToggle').onclick=()=>{const button=$('#mobileMenuToggle'),open=button.getAttribute('aria-expanded')!=='true';button.setAttribute('aria-expanded',String(open));button.setAttribute('aria-label',open?'Đóng menu':'Mở menu');button.title=open?'Đóng menu':'Mở menu'};
Theme.init();DeviceMode.init();Cart.badge();$('#cartBtn').onclick=()=>Cart.open();$('#zalo').href=CONFIG.zalo;$('#yr').textContent=new Date().getFullYear();
addEventListener('hashchange',()=>Router.render());Router.render(true);
</script>
</body>
